<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RecipeJS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>🍳 RecipeJS</h1>

    <div class="search-bar">
      <input id="search-input" type="text" placeholder="Search recipes..." />
      <button id="clear-search" style="display:none;">✖</button>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <div class="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="easy">Easy</button>
        <button data-filter="medium">Medium</button>
        <button data-filter="hard">Hard</button>
        <button data-filter="favorites">❤️ Favorites</button>
      </div>

      <div class="sorts">
        <button data-sort="name">Name (A–Z)</button>
        <button data-sort="time">Time (Fastest)</button>
      </div>
    </div>

    <p id="recipe-counter" class="counter"></p>

    <section id="recipe-container" class="recipe-container"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
